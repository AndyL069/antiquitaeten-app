services:
  db:
    image: postgres:16
    container_name: antiquitaeten-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: antik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: antik_app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antik -d antik_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/andyl069/antiquitaeten-app:latest
    container_name: antiquitaeten-app
    restart: unless-stopped
    extra_hosts:
      - "antik.am-homelab.de:192.168.178.117"
      - "auth.am-homelab.de:192.168.178.117"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://antik:${POSTGRES_PASSWORD}@db:5432/antik_app
      SECRET_KEY: ${SECRET_KEY:-${AUTH_SECRET}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003,http://localhost:3000,https://antik.am-homelab.de}
    ports:
      - "${PORT:-3003}:3000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
